name: wormhole-vpn

services:
  db:
    build:
      context: ./images/mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      TZ: ${APP_TIMEZONE}
      LOG_DIR_ROOT: ${LOG_DIR_ROOT}
      MYSQL_GENERAL_LOG: ${MYSQL_GENERAL_LOG}
      MYSQL_SLOW_LOG_THRESHOLD_MS: ${MYSQL_SLOW_LOG_THRESHOLD_MS}
    volumes:
      - db-data:/var/lib/mysql
      - ./bootstrap/db:/docker-entrypoint-initdb.d:ro
      - ./var/log:${LOG_DIR_ROOT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  freeradius:
    build:
      context: ./images/freeradius
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE}
      RADIUS_DB_HOST: db
      RADIUS_DB_PORT: ${RADIUS_DB_PORT}
      RADIUS_DB_NAME: ${RADIUS_DB_NAME}
      RADIUS_DB_USER: ${RADIUS_DB_USER}
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD}
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET}
      LOG_DIR_ROOT: ${LOG_DIR_ROOT}
    volumes:
      - ./var/log:${LOG_DIR_ROOT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pgrep -x freeradius >/dev/null || pgrep -x radiusd >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  admin-portal:
    build:
      context: ./images/admin-portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      freeradius:
        condition: service_healthy
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE}
      DB_HOST: db
      DB_PORT: ${RADIUS_DB_PORT}
      DB_NAME: ${RADIUS_DB_NAME}
      DB_USER: ${RADIUS_DB_USER}
      DB_PASSWORD: ${RADIUS_DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_BIND_PORT: ${ADMIN_BIND_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR_ROOT: ${LOG_DIR_ROOT}
      VPN_SHARED_PSK: ${VPN_SHARED_PSK}
      VPN_DEFAULT_SPEED_PROFILE: ${VPN_DEFAULT_SPEED_PROFILE}
      VPN_MAX_CONCURRENT_SESSIONS: ${VPN_MAX_CONCURRENT_SESSIONS}
      VPN_GATEWAYS: ${VPN_GATEWAYS}
    ports:
      - "127.0.0.1:${ADMIN_PORTAL_PORT}:${ADMIN_BIND_PORT}"
    volumes:
      - ./var/log:${LOG_DIR_ROOT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${ADMIN_BIND_PORT}/healthz', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ipsec-l2tp-gateway:
    build:
      context: ./images/ipsec-l2tp-gateway
    restart: unless-stopped
    depends_on:
      freeradius:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
      - /dev/ppp:/dev/ppp
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE}
      VPN_SHARED_PSK: ${VPN_SHARED_PSK}
      VPN_L2TP_PORT: ${VPN_L2TP_PORT}
      VPN_IPSEC_IKE_PORT: ${VPN_IPSEC_IKE_PORT}
      VPN_IPSEC_NATT_PORT: ${VPN_IPSEC_NATT_PORT}
      VPN_NETWORK: ${VPN_NETWORK}
      VPN_NETMASK: ${VPN_NETMASK}
      VPN_GATEWAY_IP: ${VPN_GATEWAY_IP}
      VPN_DNS_1: ${VPN_DNS_1}
      VPN_DNS_2: ${VPN_DNS_2}
      VPN_MTU: ${VPN_MTU}
      VPN_NAT_DEVICE: ${VPN_NAT_DEVICE}
      VPN_RADIUS_HOST: freeradius
      VPN_RADIUS_AUTH_PORT: ${VPN_RADIUS_AUTH_PORT}
      VPN_RADIUS_ACCT_PORT: ${VPN_RADIUS_ACCT_PORT}
      VPN_NAS_IDENTIFIER: ${VPN_NAS_IDENTIFIER}
      VPN_NAS_IP_ADDRESS: ${VPN_NAS_IP_ADDRESS}
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET}
      LOG_DIR_ROOT: ${LOG_DIR_ROOT}
    volumes:
      - ./var/log:${LOG_DIR_ROOT}
    ports:
      - "${VPN_IPSEC_IKE_PORT}:${VPN_IPSEC_IKE_PORT}/udp"
      - "${VPN_IPSEC_NATT_PORT}:${VPN_IPSEC_NATT_PORT}/udp"
      - "${VPN_L2TP_PORT}:${VPN_L2TP_PORT}/udp"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x accel-pppd >/dev/null && pgrep -f '/usr/lib/ipsec/starter|charon' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  logrotate:
    build:
      context: ./images/logrotate
    restart: unless-stopped
    environment:
      LOG_DIR_ROOT: ${LOG_DIR_ROOT}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS}
    volumes:
      - ./var/log:${LOG_DIR_ROOT}

volumes:
  db-data:
